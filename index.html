<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riset Produk Digital</title>
<style>
:root{
  --bg:#faf7f2; --panel:#ffffff; --ink:#23201c; --muted:#7a736a; --line:#e7e0d5;
  --accent:#b4532a; --accent-soft:#f6e8df; --side:#262019; --side-ink:#e9e2d6; --side-mut:#a89c8a;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
/* ---------- gate ---------- */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 20% -10%,#3d2c1c 0%,transparent 60%),radial-gradient(1000px 600px at 110% 110%,#5a3220 0%,transparent 55%),linear-gradient(160deg,#241b12,#171310);z-index:50;padding:20px}
.gate-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);border-radius:20px;padding:40px 36px;max-width:380px;width:100%;text-align:center;color:#f3ede2;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.gate-card .lock{width:54px;height:54px;margin:0 auto 16px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.gate-card h1{font-size:22px;margin:0 0 6px;font-weight:700;letter-spacing:.2px}
.gate-card p{margin:0 0 22px;color:#cbbfa9;font-size:14px;line-height:1.55}
.gate-card form{display:flex;gap:8px}
.gate-card input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.35);color:#fff;font-size:15px;outline:none;min-width:0}
.gate-card input:focus{border-color:var(--accent)}
.gate-card button{padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.gate-card button:hover{filter:brightness(1.1)}
#gate-err{display:none;margin-top:14px;color:#f2a18c;font-size:13.5px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* ---------- app layout ---------- */
#app{display:none;min-height:100vh}
#sidebar{position:fixed;top:0;left:0;bottom:0;width:292px;background:var(--side);color:var(--side-ink);overflow-y:auto;padding:22px 0 30px;z-index:20;transition:transform .25s}
.brand{padding:0 20px 14px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.brand .t{font-size:16.5px;font-weight:700;color:#fff}
.brand .s{font-size:12px;color:var(--side-mut);margin-top:3px}
#navsearch{margin:0 16px 12px;width:calc(100% - 32px);padding:9px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);color:#fff;font-size:13.5px;outline:none}
.nav-group{margin:2px 0}
.nav-head{padding:8px 20px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--side-mut);cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.nav-head:hover{color:#fff}
.nav-head .car{transition:transform .2s;font-size:10px}
.nav-group.closed .nav-head .car{transform:rotate(-90deg)}
.nav-group.closed .nav-items{display:none}
.nav-items{padding-bottom:6px}
a.nav-link{display:block;padding:6.5px 20px 6.5px 26px;color:var(--side-ink);text-decoration:none;font-size:14px;border-left:3px solid transparent;line-height:1.35}
a.nav-link:hover{background:rgba(255,255,255,.05)}
a.nav-link.active{background:rgba(180,83,42,.18);border-left-color:var(--accent);color:#fff;font-weight:600}
.nav-sub{margin:4px 0 6px}
.nav-sub .nav-head{padding-left:26px;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--side-ink);font-weight:600}
.nav-sub a.nav-link{padding-left:36px;font-size:13.5px}
.nav-sub .nav-sub a.nav-link{padding-left:46px}
#main{margin-left:292px;padding:30px 34px 90px}
.topbar{max-width:880px;margin:0 auto 8px;display:flex;justify-content:flex-end;gap:8px}
.topbar button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:7px 13px;border-radius:9px;font-size:13px;cursor:pointer}
.topbar button:hover{color:var(--ink);border-color:#d8cfbf}
#content{max-width:880px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:38px 44px;box-shadow:0 2px 14px rgba(60,45,25,.05)}
#hamb{display:none;position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:40;background:var(--side);color:#fff;border:0;border-radius:10px;width:46px;height:46px;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#overlay{display:none;position:fixed;inset:0;background:rgba(20,14,8,.5);z-index:15}
@media(max-width:900px){
  #sidebar{transform:translateX(-105%);width:min(84vw,320px);padding-top:calc(22px + env(safe-area-inset-top))}
  #sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.45)}
  #overlay.show{display:block}
  #main{margin-left:0;padding:calc(74px + env(safe-area-inset-top)) 10px 56px}
  #content{padding:24px 16px;border-radius:12px}
  #content h1{font-size:22.5px}
  #content h2{font-size:18.5px;margin-top:24px}
  #content h3{font-size:15.5px}
  #content p,#content li{font-size:15px;line-height:1.68}
  #content table{font-size:13px}
  #content th{padding:8px 9px}
  #content td{padding:7px 9px}
  #content td a{white-space:normal;overflow-wrap:anywhere}
  #content li a{overflow-wrap:anywhere}
  .tablewrap{margin:12px -4px 18px}
  .tablewrap td:first-child,.tablewrap th:first-child{position:sticky;left:0;background:#fff;box-shadow:1px 0 0 var(--line)}
  .tablewrap th:first-child{background:#f7f2ea;z-index:1}
  a.nav-link{padding-top:10px;padding-bottom:10px;font-size:15px}
  .nav-sub a.nav-link{font-size:14.5px}
  .nav-head{padding-top:11px;padding-bottom:11px}
  .gate-card{padding:32px 22px}
  .gate-card form{flex-direction:column}
  .gate-card button{padding:13px}
  .topbar{margin-bottom:4px}
}
/* ---------- article ---------- */
#content h1{font-size:27px;line-height:1.25;margin:0 0 18px;font-weight:750}
#content h2{font-size:20.5px;margin:30px 0 10px;padding-top:8px;font-weight:700}
#content h3{font-size:16.5px;margin:22px 0 8px;font-weight:700}
#content p,#content li{font-size:15.5px;line-height:1.72}
#content ul,#content ol{padding-left:24px}
#content li{margin:3px 0}
#content a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-soft)}
#content a:hover{border-bottom-color:var(--accent)}
#content em{color:#4c463f}
#content hr{border:0;border-top:1px solid var(--line);margin:26px 0}
#content blockquote{margin:16px 0;padding:12px 18px;background:#fbf6ee;border-left:4px solid var(--accent);border-radius:0 10px 10px 0;color:#4c463f}
#content blockquote p{margin:4px 0}
#content code{background:#f3eee6;padding:1.5px 6px;border-radius:6px;font-size:13.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tablewrap{overflow-x:auto;margin:16px 0 22px;border:1px solid var(--line);border-radius:10px}
#content table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
#content th{background:#f7f2ea;text-align:left;padding:9px 12px;font-weight:700;border-bottom:2px solid var(--line);white-space:nowrap}
#content td{padding:8px 12px;border-bottom:1px solid #f0eadd;vertical-align:top}
#content tr:last-child td{border-bottom:0}
#content tbody tr:hover td{background:#fdfaf5}
#content td a{white-space:nowrap}
.footnote{max-width:880px;margin:14px auto 0;color:var(--muted);font-size:12.5px;text-align:center}
</style>
</head>

<div id="gate">
  <div class="gate-card" id="gate-card">
    <div class="lock"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <h1>Riset Produk Digital</h1>

      <button type="submit" id="gate-btn">Buka</button>
    </form>
    <div id="gate-err">Password salah — coba lagi.</div>
  </div>
</div>

<button id="hamb" aria-label="Menu">☰</button>
<div id="overlay"></div>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><div class="t">Riset Produk Digital</div><div class="s">Meta Ads Library · Indonesia · Produk digital</div></div>

    <nav id="nav"></nav>
  </aside>
  <main id="main">
    <div class="topbar"><button id="lock-btn" type="button">🔒 Kunci lagi</button></div>
    <article id="content"></article>
    <div class="footnote" id="foot"></div>
  </main>
</div>

let SITE = null;

function b64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function unlock(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(BLOB.salt),iterations:BLOB.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(BLOB.iv)},key,b64(BLOB.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryUnlock(pw,quiet){
  try{
    SITE=await unlock(pw);
    sessionStorage.setItem("rp_pw",pw);
    document.getElementById("gate").style.display="none";
    document.getElementById("app").style.display="block";
    buildNav(); route();
    return true;
  }catch(e){
    if(!quiet){
      document.getElementById("gate-err").style.display="block";
      const c=document.getElementById("gate-card");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");
    }
    return false;
  }
}
document.getElementById("gate-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("gate-btn");btn.textContent="Membuka…";btn.disabled=true;
  const ok=await tryUnlock(document.getElementById("gate-pass").value,false);
  if(!ok){btn.textContent="Buka";btn.disabled=false;}
});
document.getElementById("lock-btn").addEventListener("click",()=>{
  sessionStorage.removeItem("rp_pw");SITE=null;location.hash="";
  document.getElementById("app").style.display="none";
  document.getElementById("gate").style.display="flex";
  const btn=document.getElementById("gate-btn");btn.textContent="Buka";btn.disabled=false;
  document.getElementById("gate-pass").value="";
});

function buildNav(){
  const nav=document.getElementById("nav");nav.innerHTML="";
  SITE.nav.forEach(item=>{
    if(item.route!==undefined && !item.children){
      const a=document.createElement("a");a.className="nav-link";a.href="#/"+item.route;a.textContent=item.label;a.dataset.route=item.route;nav.appendChild(a);
    }else{
      nav.appendChild(navGroup(item,0));
    }
  });
}
function navGroup(item,depth){
  const g=document.createElement("div");g.className=depth===0?"nav-group":"nav-group nav-sub";
  const h=document.createElement("div");h.className="nav-head";
  h.innerHTML="<span></span><span class='car'>▾</span>";h.firstChild.textContent=item.label;
  h.addEventListener("click",()=>g.classList.toggle("closed"));
  g.appendChild(h);
  const box=document.createElement("div");box.className="nav-items";
  (item.children||[]).forEach(ch=>{
    if(ch.children){box.appendChild(navGroup(ch,depth+1));}
    else{const a=document.createElement("a");a.className="nav-link";a.href="#/"+ch.route;a.textContent=ch.label;a.dataset.route=ch.route;box.appendChild(a);}
  });
  g.appendChild(box);
  return g;
}
function route(){
  if(!SITE)return;
  let r=decodeURIComponent(location.hash.replace(/^#\/?/,""));
  if(!(r in SITE.pages)) r="";
  const pg=SITE.pages[r];
  const c=document.getElementById("content");
  c.innerHTML=pg.html;
  c.querySelectorAll("table").forEach(t=>{const w=document.createElement("div");w.className="tablewrap";t.parentNode.insertBefore(w,t);w.appendChild(t);});
  document.title=pg.title+" · Riset Produk Digital";
  document.getElementById("foot").textContent="Sumber: Meta Ads Library (publik) · Indonesia · Iklan aktif berjalan > 1 bulan · Disusun "+SITE.generated;
  document.querySelectorAll("a.nav-link").forEach(a=>{
    const on=a.dataset.route===r;
    a.classList.toggle("active",on);
    if(on){let p=a.closest(".nav-group");while(p){p.classList.remove("closed");p=p.parentElement?p.parentElement.closest(".nav-group"):null;}}
  });
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
function toggleSide(force){
  const sb=document.getElementById("sidebar"),ov=document.getElementById("overlay");
  const open=force!==undefined?force:!sb.classList.contains("open");
  sb.classList.toggle("open",open);ov.classList.toggle("show",open);
}
document.getElementById("hamb").addEventListener("click",()=>toggleSide());
document.getElementById("overlay").addEventListener("click",()=>toggleSide(false));
document.getElementById("navsearch").addEventListener("input",e=>{
  const q=e.target.value.toLowerCase();
  document.querySelectorAll("a.nav-link").forEach(a=>{
    const show=!q||a.textContent.toLowerCase().includes(q);
    a.style.display=show?"":"none";
    if(q&&show){let p=a.closest(".nav-group");while(p){p.classList.remove("closed");p=p.parentElement?p.parentElement.closest(".nav-group"):null;}}
  });
});
(async()=>{const saved=sessionStorage.getItem("rp_pw");if(saved){const ok=await tryUnlock(saved,true);if(!ok)sessionStorage.removeItem("rp_pw");}})();
</script>
